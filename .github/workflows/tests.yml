name: Tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Unit-Tests Ticketautomat
        working-directory: 14_ticketautomat_schwimmbad
        run: python -m unittest -v test_classes
      - name: Unit-Tests kleine Funktionen
        working-directory: 18_kleine_funktionen
        run: python -m unittest -v test_aufgaben
